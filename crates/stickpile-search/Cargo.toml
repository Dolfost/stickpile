[package]
name = "stickpile-search"
description = "In-memory hybrid (lexical + vector) search index shared by server and offline clients"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish = false

[dependencies]
stickpile-api.workspace = true
unicode-normalization.workspace = true
unicode-segmentation.workspace = true
# Inflates the emoji names table (build.rs deflates it): the version flate2
# (under png) already brings into every client, inflate code included, so
# neither a crate nor much code is added.
miniz_oxide = "0.9.1"

[build-dependencies]
miniz_oxide = "0.9.1"
