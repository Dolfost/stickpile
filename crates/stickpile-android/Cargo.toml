[package]
name = "stickpile-android"
description = "stickpile for Android, the Rust side: a library over stickpile-core, behind a UniFFI interface for the Kotlin app in android/"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish = false

[lib]
name = "stickpile_android"
# cdylib: libstickpile_android.so, loaded by the app through JNA; lib: the
# host tests and the bindings generator.
crate-type = ["cdylib", "lib"]

# Generates the Kotlin side of the interface: see the uniffi tasks in
# android/app/build.gradle.kts.
[[bin]]
name = "uniffi-bindgen"
path = "uniffi-bindgen.rs"
required-features = ["bindgen"]

[features]
bindgen = ["uniffi/cli"]

[dependencies]
stickpile-api.workspace = true
stickpile-core.workspace = true
# The search suggestions (`suggest`), display-free: no X11 without its
# `x11` feature.
stickpile-quick.workspace = true
# `tokio`: async functions run under `async_runtime = "tokio"`.
uniffi = { version = "0.32", features = ["tokio"] }
tokio.workspace = true
thiserror.workspace = true
tracing.workspace = true
# `stickpile_core::settings::set_value` takes a TOML value.
toml.workspace = true
url.workspace = true

# The device model for the token name (`ro.product.model`).
[target.'cfg(target_os = "android")'.dependencies]
libc = "0.2"

[dev-dependencies]
stickpile-core = { workspace = true, features = ["mock"] }
# `bindgen`: the test that generates the Kotlin bindings.
uniffi = { version = "0.32", features = ["tokio", "bindgen"] }
tempfile.workspace = true
image.workspace = true
