[package]
name = "stickpile-desktop"
description = "stickpile Linux desktop client (GTK4 + libadwaita), and the display-free parts the macOS app shares"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish = false

[lib]
path = "src/lib.rs"

[[bin]]
name = "stickpile-desktop"
path = "src/main.rs"
required-features = ["gtk"]

[features]
default = ["gtk", "x11"]
# The GTK4 popup, the `stickpile-desktop` program. Without it the crate is
# only its display-free modules, which the macOS app shares.
gtk = ["dep:gtk", "dep:adw"]
# Focused-window detection in X11 sessions.
x11 = ["stickpile-quick/x11"]

[dependencies]
stickpile-api.workspace = true
stickpile-core.workspace = true
stickpile-quick.workspace = true
stickpile-i18n.workspace = true
gtk = { workspace = true, optional = true }
adw = { workspace = true, optional = true }
anyhow.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
clap.workspace = true
futures.workspace = true
image.workspace = true
url.workspace = true
toml.workspace = true

[dev-dependencies]
tempfile.workspace = true
# In-process mock server for display-free tests of the core adapter.
stickpile-core = { workspace = true, features = ["mock"] }
