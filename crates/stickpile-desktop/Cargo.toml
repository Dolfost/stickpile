[package]
name = "stickpile-desktop"
description = "stickpile Linux desktop client (GTK4 + libadwaita)"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish = false

[lib]
path = "src/lib.rs"

[[bin]]
name = "stickpile-desktop"
path = "src/main.rs"

[features]
default = ["x11"]
# Focused-window detection in X11 sessions.
x11 = ["stickpile-quick/x11"]

[dependencies]
stickpile-api.workspace = true
stickpile-core.workspace = true
stickpile-quick.workspace = true
gtk.workspace = true
adw.workspace = true
anyhow.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
clap.workspace = true
futures.workspace = true
image.workspace = true
url.workspace = true

[dev-dependencies]
tempfile.workspace = true
# In-process mock server for display-free tests of the core adapter.
stickpile-core = { workspace = true, features = ["mock"] }
