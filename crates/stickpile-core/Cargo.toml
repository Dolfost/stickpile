[package]
name = "stickpile-core"
description = "Shared client library: API client, token storage, offline cache, usage queue, clipboard offers, quick-search model"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
default = ["wayland", "x11"]
# CLI clipboard backends (the GTK client uses GDK instead).
wayland = ["dep:wl-clipboard-rs"]
x11 = ["dep:x11rb"]
# In-process axum mock of the stickpile REST API (`stickpile_core::mock`), for
# client tests in this crate and in the CLI.
mock = ["dep:axum"]

[dependencies]
stickpile-api.workspace = true
stickpile-search.workspace = true
stickpile-setfmt.workspace = true
anyhow.workspace = true
thiserror.workspace = true
serde.workspace = true
serde_json.workspace = true
toml.workspace = true
tracing.workspace = true
tokio.workspace = true
reqwest.workspace = true
rusqlite.workspace = true
directories.workspace = true
url.workspace = true
rand.workspace = true
data-encoding.workspace = true
sha2.workspace = true
hex.workspace = true
image.workspace = true
bytes.workspace = true
futures.workspace = true
axum = { workspace = true, optional = true }

# The CLI clipboard backends exist only on Linux; build.rs turns the
# `wayland`/`x11` features into `wl_backend`/`x11_backend` cfgs there, so the
# crate still builds for macOS and Windows with default features.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "linux")'.dependencies]
wl-clipboard-rs = { workspace = true, optional = true }
x11rb = { workspace = true, optional = true }

[dev-dependencies]
tempfile.workspace = true
axum.workspace = true
