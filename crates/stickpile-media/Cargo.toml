[package]
name = "stickpile-media"
description = "Media sniffing, sanitising, variants, perceptual hashing and quality scoring"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish = false

[dependencies]
stickpile-api.workspace = true
image.workspace = true
gif.workspace = true
webp.workspace = true
# libwebp's animation encoder, fed one frame at a time (WhatsApp stickers);
# the same library the `webp` crate builds.
libwebp-sys = "0.9"
sha2.workspace = true
hex.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tempfile.workspace = true
tracing.workspace = true
# Raw PNG decode/encode (palette, bit depth and tRNS kept as-is); same
# version the image crate already pulls in.
png = "0.18"
# NeuQuant palettes for APNG and GIF stickers (Discord, Signal); the version
# the gif and image crates already pull in.
color_quant = "1.1"

[dev-dependencies]
