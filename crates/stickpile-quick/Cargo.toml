[package]
name = "stickpile-quick"
description = "Toolkit-free quick-search popup state machine and focused-window detection"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish = false

[features]
default = []
