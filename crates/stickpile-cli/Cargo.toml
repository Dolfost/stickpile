[package]
name = "stickpile-cli"
description = "stickpile command-line client"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "stickpile"
path = "src/main.rs"

[dependencies]
stickpile-api.workspace = true
stickpile-core = { workspace = true, features = ["wayland", "x11"] }
anyhow.workspace = true
clap.workspace = true
tokio.workspace = true
serde.workspace = true
serde_json.workspace = true
time.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
rpassword = "7"
unicode-width = "0.2"

[dev-dependencies]
stickpile-core = { workspace = true, features = ["mock"] }
stickpile-setfmt.workspace = true
image.workspace = true
tempfile.workspace = true
