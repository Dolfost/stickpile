  "screaming", "smiling", "winking", "staring", "side eye", "eye roll", "thinking", "sweating",
  "blushing", "hiding", "falling", "sitting", "lying in bed", "working on a laptop",
  # reactions
  "mind blown", "explosion", "applause", "surprised face", "angry face", "crying face",
  "laughing face", "sad face", "happy face", "disgusted face", "confused face", "smug face",
  "nervous face", "panic", "rage", "heartbreak", "celebration", "party", "victory", "fail",
