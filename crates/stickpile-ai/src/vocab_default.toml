# Built-in zero-shot vocabulary of stickpile-ai (docs/ai.md).
#
# A file given as `[ai] vocabulary_file` uses this exact format. Each of the
# three top-level keys is optional: a missing key keeps the built-in list, an
# explicit empty list disables that kind of suggestion.
#
#   keywords = ["cat", "thumbs up", ...]          # plain English noun phrases
#   [[emojis]]  emoji = "😂"  description = "..."  # what it depicts; the CLIP prompt
#   [[vibes]]   label = "dismissive"  synonyms = ["nah", "nope", ...]
#
# Keywords are prompted as "a meme of {keyword}" / "a sticker of {keyword}" /
# "a picture of {keyword}"; emoji descriptions as "{description}" / "a sticker
# of {description}" (describe what the emoji looks like). Vibe labels are what
# `vibe:` search uses; synonyms feed the zero-shot vibe prototype and lexical
# search expansion, where repeated letters are squashed ("naahh" matches "nah").

keywords = [
  # animals
  "cat", "kitten", "dog", "puppy", "shiba inu", "frog", "monkey", "gorilla", "bear", "panda",
  "fox", "raccoon", "capybara", "hamster", "rabbit", "bird", "duck", "goose", "owl", "penguin",
  "parrot", "chicken", "horse", "cow", "pig", "sheep", "goat", "fish", "shark", "dolphin",
  "snake", "lizard", "turtle", "spider", "bee", "butterfly", "mouse", "rat", "squirrel", "otter",
  "seal", "lion", "tiger", "wolf", "deer", "llama", "sloth", "koala", "hedgehog", "crab",
  "octopus", "dinosaur", "unicorn", "dragon",
  # people and characters
