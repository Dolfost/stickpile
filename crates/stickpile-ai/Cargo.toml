[package]
name = "stickpile-ai"
description = "CLIP-based enrichment: embeddings, zero-shot keywords/emojis/vibe; OCR"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish = false

[features]
default = ["clip", "ocr"]
# In-process CLIP through ONNX Runtime (loaded dynamically, CPU).
clip = ["dep:ort", "dep:tokenizers", "dep:safetensors"]
# In-process OCR (PaddleOCR PP-OCRv5 det + Cyrillic rec) through the same
# ONNX Runtime; pre- and post-processing in pure Rust.
ocr = ["dep:ort"]

[dependencies]
# The item text rules (`stickpile_api::text`) for OCR output.
stickpile-api.workspace = true
image.workspace = true
serde.workspace = true
toml.workspace = true
thiserror.workspace = true
tracing.workspace = true
sha2.workspace = true
ort = { workspace = true, optional = true }
tokenizers = { workspace = true, optional = true }
safetensors = { workspace = true, optional = true }

[dev-dependencies]
tempfile.workspace = true
serde_json.workspace = true

[[example]]
name = "probe"
required-features = ["clip"]

[[example]]
name = "ocr"
required-features = ["ocr"]
