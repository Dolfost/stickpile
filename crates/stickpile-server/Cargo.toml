[package]
name = "stickpile-server"
description = "stickpile server: REST API, web UI, media pipeline, search, imports"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish = false

[[bin]]
name = "stickpile-server"
path = "src/main.rs"

[features]
default = ["clip", "ocr"]
clip = ["stickpile-ai/clip"]
ocr = ["stickpile-ai/ocr"]

[dependencies]
stickpile-api = { workspace = true, features = ["openapi"] }
stickpile-search.workspace = true
# The search field's suggestions (`suggest`), as the popups offer them.
stickpile-quick.workspace = true
stickpile-i18n.workspace = true
stickpile-setfmt.workspace = true
stickpile-media.workspace = true
stickpile-ai.workspace = true
stickpile-telegram.workspace = true
stickpile-discord.workspace = true
stickpile-signal.workspace = true
stickpile-gitpack.workspace = true
anyhow.workspace = true
thiserror.workspace = true
serde.workspace = true
serde_json.workspace = true
toml.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
tokio.workspace = true
futures.workspace = true
bytes.workspace = true
clap.workspace = true
rand.workspace = true
sha2.workspace = true
hex.workspace = true
base64.workspace = true
data-encoding.workspace = true
time.workspace = true
axum.workspace = true
axum-extra.workspace = true
tower.workspace = true
tower-http.workspace = true
hyper.workspace = true
hyper-util.workspace = true
sqlx.workspace = true
maud.workspace = true
utoipa.workspace = true
argon2.workspace = true
totp-rs.workspace = true
governor.workspace = true
subtle.workspace = true
tar.workspace = true
zip.workspace = true
flate2 = "1"
mime_guess.workspace = true
image.workspace = true
tempfile.workspace = true
tokio-util = { version = "0.7.20", features = ["io", "rt"] }
# Downloading the AI model files at start (src/models.rs); the integration
# crates already build it.
reqwest.workspace = true
form_urlencoded = "1.2.2"
qrcode = { version = "0.15.0", default-features = false }
http-body-util = "0.1.3"

[dev-dependencies]
git2.workspace = true
reqwest = { workspace = true, features = ["cookies"] }
tempfile.workspace = true
# tests/review_search.rs: the clients' offline cache and index, synced
# from the test server.
stickpile-core.workspace = true
# The library the suggest endpoint is timed on (`service::search::perf`).
stickpile-search = { workspace = true, features = ["synthetic"] }
