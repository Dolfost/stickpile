[package]
name = "stickpile-api"
description = "Shared REST API types, search query syntax and target-app profiles for stickpile"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish = false

[features]
# Derives utoipa::ToSchema on every DTO; enabled by the server for OpenAPI.
openapi = ["dep:utoipa"]

[dependencies]
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
utoipa = { workspace = true, optional = true }
