# Release on a `v*` tag (e.g. v0.2.0; must match the workspace version).
#
#   linux      server, CLI, desktop for x86_64 and aarch64, built by Nix and
#              repackaged to run outside Nix (see "Linux tarballs" below)
#   macos      CLI + server for arm64 and x86_64, built by cargo, and the
#              Stickpile app (crates/stickpile-mac, ad-hoc signed)
#   windows    CLI, built by cargo (best effort)
#   android    the Android app as a release APK, built by Gradle and
#              cargo-ndk (best effort), signed with the release key from the
#              secrets ANDROID_KEYSTORE_BASE64 and ANDROID_KEYSTORE_PASSWORD
#              and checked against ANDROID_CERT_SHA256; without the secrets
#              it is published unsigned (docs/android.md, "Release signing")
#   container  ghcr.io/dolfost/stickpile:<version> and :latest, multi-arch,
#              built by Nix and pushed with skopeo
#   release    GitHub release with every artifact and SHA256SUMS
#   stable     moves the `stable` branch to the release, for flake inputs
#   homebrew   points the Homebrew cask (Casks/stickpile.rb) at the release's
#              macOS zips and commits it to main
#
# Linux tarballs: Nix binaries point at /nix/store for their loader and
# libraries. The release job rewrites the ELF interpreter to the distribution's
# (/lib64/ld-linux-x86-64.so.2, /lib/ld-linux-aarch64.so.1) and drops the store
# RUNPATH, so they run against system libraries. README.txt in each tarball
# lists the shared libraries every binary needs and the minimum glibc. On
# NixOS or with Nix, use the flake instead (`nix profile install
# github:Dolfost/stickpile#stickpile-cli`).
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to (re)build, e.g. v0.1.0"
        required: true

permissions:
  contents: read

env:
  TAG: ${{ inputs.tag || github.ref_name }}
  IMAGE: ghcr.io/dolfost/stickpile
  # SHA-256 of the Android release key's certificate (docs/android.md,
  # "Release signing"). A signed APK with any other certificate fails the
  # android job.
  ANDROID_CERT_SHA256: ab7200c912206a158239eb8463d37329785aa838c67f98343b5a44201034e120

jobs:
  linux:
    name: linux (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: x86_64
            interpreter: /lib64/ld-linux-x86-64.so.2
          - runner: ubuntu-24.04-arm
            arch: aarch64
            interpreter: /lib/ld-linux-aarch64.so.1
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}
      - uses: DeterminateSystems/nix-installer-action@v23
      - uses: DeterminateSystems/magic-nix-cache-action@v15
      - name: Tag matches the workspace version
        run: |
          version="$(nix eval --raw .#stickpile-server.version)"
          [ "v$version" = "$TAG" ] || { echo "tag $TAG != workspace version $version"; exit 1; }
      - name: Build
        run: |
          nix build -L --out-link server .#stickpile-server
          nix build -L --out-link cli .#stickpile-cli
          nix build -L --out-link desktop .#stickpile-desktop
      - name: Package
        run: |
          set -euo pipefail
          name="stickpile-${TAG}-${{ matrix.arch }}-linux"
          mkdir -p "$name/bin" "$name/share" dist
          # The real ELF files, not the Nix wrappers (makeBinaryWrapper /
          # wrapGAppsHook4 keep them as .<name>-wrapped).
          for pair in server:stickpile-server cli:stickpile desktop:stickpile-desktop; do
            link="${pair%%:*}" bin="${pair#*:}"
            src="$link/bin/.$bin-wrapped"
            [ -e "$src" ] || src="$link/bin/$bin"
            install -m755 "$src" "$name/bin/$bin"
          done
          cp -rL desktop/share/applications desktop/share/icons "$name/share/" 2>/dev/null || true
          cp -L server/share/doc/stickpile/config.example.toml "$name/"
          cp LICENSE* README* "$name/" 2>/dev/null || true
          patchelf() { nix run --inputs-from . nixpkgs#patchelf -- "$@"; }
          {
            echo "stickpile $TAG for ${{ matrix.arch }} Linux (glibc)."
            echo
            echo "Runtime: ffmpeg/ffprobe on PATH for videos and animations;"
            echo "libonnxruntime (ORT_DYLIB_PATH or ai.onnxruntime_library) for AI."
            echo
          } > "$name/README.txt"
          for f in "$name"/bin/*; do
            patchelf --set-interpreter "${{ matrix.interpreter }}" --remove-rpath "$f"
            glibc="$(objdump -T "$f" | grep -o 'GLIBC_[0-9.]*' | sort -uV | tail -n1)"
            echo "$(basename "$f") needs $glibc or newer and:" >> "$name/README.txt"
            patchelf --print-needed "$f" | sed 's/^/  /' >> "$name/README.txt"
          done
          cat "$name/README.txt"
          tar -czf "dist/$name.tar.gz" "$name"
      - uses: actions/upload-artifact@v7
        with:
          name: linux-${{ matrix.arch }}
          path: dist/*

  macos:
    name: macos (${{ matrix.arch }})
    # Best effort until the clients are checked on macOS (post-v1).
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
            target: aarch64-apple-darwin
          - runner: macos-15-intel
            arch: x86_64
            target: x86_64-apple-darwin
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      # libgit2 is vendored here; its ssh transport (libssh2) links the
      # Homebrew OpenSSL that the runner image ships. The server keeps the
      # `clip` feature: ort is loaded at runtime (load-dynamic), so nothing
      # links ONNX Runtime at build time; install it with
      # `brew install onnxruntime` to enable AI.
      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }} -p stickpile-cli -p stickpile-server
      # The app is built and tested with the newest Swift and macOS SDK; the
      # image's default Xcode can be older.
      - name: Use the newest Xcode
        run: |
          xcode=$(find /Applications -maxdepth 1 -name "Xcode_*.app" | sort -V | tail -n 1)
          sudo xcode-select -s "$xcode"
          echo "::notice::$(basename "$xcode"): $(swiftc --version 2>&1 | head -n 1)"
      # The menu bar app: the Rust driver for this target, then the Swift app.
      # Ad-hoc signed, not notarized (docs/macos.md).
      - name: Build Stickpile.app
        env:
          TARGET: ${{ matrix.target }}
          OUT: app-dist
        # Errors also become annotations: reading the job log needs admin
        # rights, annotations do not.
        run: |
          set -o pipefail
          crates/stickpile-mac/app/build.sh 2>&1 | tee build.log || {
            # The log from the Swift step on (else its end) as one annotation,
            # without colours (%0A is a line break).
            if grep -q '^swiftc:' build.log; then sed -n '/^swiftc:/,$p' build.log; else cat build.log; fi |
              tail -n 60 | sed -e 's/\x1b\[[0-9;]*m//g' -e 's/%/%25/g' | awk '{printf "%s%%0A", $0}' >annotation.txt
            printf '::error title=build.sh::%s\n' "$(cat annotation.txt)"
            exit 1
          }
      - name: Package
        run: |
          name="stickpile-${TAG}-${{ matrix.arch }}-macos"
          mkdir -p "$name" dist
          cp target/${{ matrix.target }}/release/stickpile target/${{ matrix.target }}/release/stickpile-server "$name/"
          cp crates/stickpile-server/config.example.toml LICENSE README.md "$name/"
          printf 'Runtime: brew install ffmpeg (videos, animations), brew install onnxruntime (AI).\n' > "$name/README.txt"
          tar -czf "dist/$name.tar.gz" "$name"
          cp app-dist/Stickpile.zip "dist/Stickpile-${TAG}-${{ matrix.arch }}-macos.zip"
      - uses: actions/upload-artifact@v7
        with:
          name: macos-${{ matrix.arch }}
          path: dist/*

  windows:
    name: windows (x86_64, CLI)
    # Best effort until the CLI is tested on Windows (its clipboard backends
    # are Linux-only).
    continue-on-error: true
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}
      - uses: dtolnay/rust-toolchain@stable
      - name: Build
        run: cargo build --release --locked -p stickpile-cli
      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Compress-Archive -Path target/release/stickpile.exe, LICENSE, README.md -DestinationPath "dist/stickpile-$env:TAG-x86_64-windows.zip"
      - uses: actions/upload-artifact@v7
        with:
          name: windows-x86_64
          path: dist/*

  android:
    name: android (APK, unsigned)
    # Best effort until the app has been run on devices.
    continue-on-error: true
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      NDK_VERSION: 28.2.13676358
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android
      # The runner image has the Android SDK (platform 37, build tools 36),
      # JDK 21 and other NDKs; the app pins its NDK (ndkVersion in
      # android/app/build.gradle.kts) and builds Rust with cargo-ndk.
      - name: NDK, JDK 21 and cargo-ndk
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;$NDK_VERSION" >/dev/null
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/$NDK_VERSION" >>"$GITHUB_ENV"
          echo "JAVA_HOME=$JAVA_HOME_21_X64" >>"$GITHUB_ENV"
          cargo install cargo-ndk --version 4.1.2 --locked
      # The release key, when both secrets are set: Gradle signs the APK with
      # it (android/app/build.gradle.kts). Without them the APK stays
      # unsigned and is published as such.
      - name: Release key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$KEYSTORE_PASSWORD" ]; then
            echo "::warning::No Android release key (secrets ANDROID_KEYSTORE_BASE64 and ANDROID_KEYSTORE_PASSWORD): the APK is published unsigned"
            exit 0
          fi
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.p12"
          echo "STICKPILE_KEYSTORE=$RUNNER_TEMP/release.p12" >> "$GITHUB_ENV"
      - name: Build
        working-directory: android
        env:
          STICKPILE_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: ./gradlew --no-daemon assembleRelease
      # A signed APK must carry the pinned certificate and keep its native
      # libraries 16 KB aligned (Android 15+ devices with 16 KB pages).
      - name: Package
        run: |
          rm -f "$RUNNER_TEMP/release.p12"
          mkdir -p dist
          out=android/app/build/outputs/apk/release
          if [ -f "$out/app-release.apk" ]; then
            bt=$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 | sort -V | tail -1)
            cert=$("$bt/apksigner" verify --print-certs "$out/app-release.apk" | sed -n 's/^Signer #1 certificate SHA-256 digest: //p')
            if [ "$cert" != "$ANDROID_CERT_SHA256" ]; then
              echo "::error::The APK is signed with certificate $cert, not the release key's $ANDROID_CERT_SHA256"
              exit 1
            fi
            "$bt/zipalign" -c -P 16 4 "$out/app-release.apk"
            cp "$out/app-release.apk" "dist/stickpile-${TAG}-android.apk"
          else
            cp "$out/app-release-unsigned.apk" "dist/stickpile-${TAG}-android-unsigned.apk"
          fi
      - uses: actions/upload-artifact@v7
        with:
          name: android
          path: dist/*

  container:
    name: container (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: amd64
          - runner: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}
      - uses: DeterminateSystems/nix-installer-action@v23
      - uses: DeterminateSystems/magic-nix-cache-action@v15
      - name: Build image
        run: nix build -L --out-link image .#container
      - name: Push ${{ env.IMAGE }}:${{ env.TAG }}-${{ matrix.arch }}
        env:
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ARCH: ${{ matrix.arch }}
        run: |
          nix run --inputs-from . nixpkgs#skopeo -- copy \
            --dest-creds "$GITHUB_ACTOR:$REGISTRY_TOKEN" \
            docker-archive:image "docker://$IMAGE:${TAG#v}-$ARCH"

  container-manifest:
    name: container (multi-arch tags)
    needs: container
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Create :<version> and :latest
        run: |
          v="${TAG#v}"
          docker buildx imagetools create \
            --tag "$IMAGE:$v" --tag "$IMAGE:latest" \
            "$IMAGE:$v-amd64" "$IMAGE:$v-arm64"
          docker buildx imagetools inspect "$IMAGE:$v"

  # android (post-v1): the Kotlin app over stickpile-core (UniFFI), a signed
  # APK from a reproducible Gradle build without proprietary dependencies, and
  # the F-Droid metadata directory (metadata/, fastlane/) for submission. The
  # Unexpected Keyboard fork releases from its own repository.

  release:
    name: GitHub release
    needs: [linux, macos, windows, android, container-manifest]
    # macOS, Windows and Android are best effort; Linux and the image are required.
    if: ${{ !cancelled() && needs.linux.result == 'success' && needs.container-manifest.result == 'success' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        working-directory: dist
        run: sha256sum -- * | tee SHA256SUMS
      - name: Publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cat > notes.md <<EOF
          Container image: \`$IMAGE:${TAG#v}\` (also \`:latest\`), linux/amd64 and linux/arm64.

          Nix: \`nix profile install github:Dolfost/stickpile/$TAG#stickpile-cli\`,
          NixOS module \`nixosModules.default\`, home-manager module \`homeManagerModules.default\`
          (docs/deployment.md, docs/nix.md). The flake input \`github:Dolfost/stickpile/stable\` follows releases.
          EOF
          if ls dist/*-android.apk >/dev/null 2>&1; then
            # shellcheck disable=SC2016 # the backticks are Markdown
            printf '\nAndroid: `stickpile-%s-android.apk`, signed with the release key (certificate SHA-256 `%s`). Android updates the app only from an APK signed with the same key (docs/android.md).\n' \
              "$TAG" "$ANDROID_CERT_SHA256" >> notes.md
          fi
          gh release create "$TAG" dist/* \
            --repo "${{ github.repository }}" \
            --title "stickpile $TAG" \
            --notes-file notes.md \
            --generate-notes \
            --verify-tag

  # Moves the `stable` branch to the released commit, so that a flake input
  # `github:Dolfost/stickpile/stable` follows releases (`nix flake update
  # stickpile` takes the newest). It only fast-forwards: rebuilding an older
  # tag with workflow_dispatch leaves the branch where it is.
  stable:
    name: stable branch
    needs: release
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}
          fetch-depth: 0
      - name: Fast-forward stable to the tag
        run: |
          commit=$(git rev-parse "refs/tags/$TAG^{commit}")
          if git rev-parse -q --verify refs/remotes/origin/stable >/dev/null \
            && ! git merge-base --is-ancestor origin/stable "$commit"; then
            echo "::notice::stable is ahead of $TAG, left alone"
            exit 0
          fi
          git push origin "$commit:refs/heads/stable"

  # This repository is a Homebrew tap (Casks/stickpile.rb, docs/macos.md):
  # point the cask at the release's macOS zips and commit it to main. Fails,
  # without touching the cask, when either zip is missing (the macOS builds
  # are best effort).
  homebrew:
    name: Homebrew cask
    needs: release
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
      - name: Update the cask
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version=${TAG#v}
          for arch in arm64 x86_64; do
            gh release download "$TAG" --repo "${{ github.repository }}" \
              --pattern "Stickpile-$TAG-$arch-macos.zip" --dir zips
          done
          arm=$(sha256sum "zips/Stickpile-$TAG-arm64-macos.zip" | cut -d' ' -f1)
          intel=$(sha256sum "zips/Stickpile-$TAG-x86_64-macos.zip" | cut -d' ' -f1)
          sed -i -E \
            -e "s/^  version \".*\"/  version \"$version\"/" \
            -e "s/(arm: +)\"[0-9a-f]{64}\"/\\1\"$arm\"/" \
            -e "s/(intel: +)\"[0-9a-f]{64}\"/\\1\"$intel\"/" \
            Casks/stickpile.rb
          git diff
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "Point the Homebrew cask at $TAG"
          git push origin HEAD:main
