# Build and test on every push and pull request.
#
#   flake-check  `nix flake check`: builds every package and the container
#                image, runs the workspace tests (nextest + doctests), clippy
#                -D warnings, rustfmt, the config drift guard, the NixOS and
#                home-manager module checks and (x86_64) the NixOS VM test.
#   coverage     cargo llvm-cov over the workspace in the dev shell; lcov
#                artifact + summary on the run page.
name: CI

on:
  push:
    branches: ["**"]
    tags-ignore: ["**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  flake-check:
    name: nix flake check (${{ matrix.system }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            system: x86_64-linux
          - runner: ubuntu-24.04-arm
            system: aarch64-linux
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      # Determinate's installer enables flakes and KVM (for the VM test).
      - uses: DeterminateSystems/nix-installer-action@main
      - uses: DeterminateSystems/magic-nix-cache-action@main
      - name: Evaluate outputs
        run: nix flake show
      - name: nix flake check
        run: nix flake check -L --keep-going

  coverage:
    name: coverage
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@main
      - uses: DeterminateSystems/magic-nix-cache-action@main
      # The dev shell provides cargo-llvm-cov, LLVM_COV/LLVM_PROFDATA for
      # rustc's LLVM, ffmpeg, git and ORT_DYLIB_PATH. stickpile-desktop and the
      # clipboard spike are GTK shells without headless tests (their logic is
      # in stickpile-quick / stickpile-core), so they are left out.
      - name: Run tests with coverage
        run: |
          nix develop -c env -u RUSTC_WRAPPER \
            cargo llvm-cov --workspace --locked \
              --exclude stickpile-desktop --exclude clipspike \
              --no-report
      - name: Reports
        run: |
          nix develop -c env -u RUSTC_WRAPPER cargo llvm-cov report --lcov --output-path lcov.info
          nix develop -c env -u RUSTC_WRAPPER cargo llvm-cov report --summary-only > coverage.txt
          {
            echo '### Coverage'
            echo '```'
            cat coverage.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: coverage-lcov
          path: |
            lcov.info
            coverage.txt
